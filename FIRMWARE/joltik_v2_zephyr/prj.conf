# Core
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096

# GPIO
CONFIG_GPIO=y

# PWM (motors + servo)
CONFIG_PWM=y

# ADC (line sensors)
CONFIG_ADC=y

# LED Strip (WS2812 via PIO)
CONFIG_LED_STRIP=y

# USB CDC ACM (console/shell)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048

# Settings (persistent storage via NVS)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_SETTINGS_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Input subsystem (button)
CONFIG_INPUT=y

# Build output
CONFIG_BUILD_OUTPUT_UF2=y

# Thread info
CONFIG_THREAD_NAME=y

# Suppress noisy USB control transfer logs
CONFIG_USB_DEVICE_LOG_LEVEL_OFF=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y
