# Test framework
CONFIG_ZTEST=y

# Drivers needed by code under test
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_ADC_EMUL=y

# LED strip (our fake driver)
CONFIG_LED_STRIP=y

# Settings / NVS
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_SETTINGS_NVS=y

# Input (button)
CONFIG_INPUT=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2

# Stack sizes
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
